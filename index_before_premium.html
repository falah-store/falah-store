<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>برامج فلاح ستور</title>
<style>

*{box-sizing:border-box}
body{margin:0;background:#050b18;color:#f5f8ff;font-family:Arial,sans-serif;line-height:1.7}
header{padding:35px 16px 25px;text-align:center;background:radial-gradient(ellipse at top,#123d72 0%,#09172d 48%,#050b18 100%);border-bottom:1px solid #174b83}
.logo{font-size:30px;font-weight:900;letter-spacing:2px;color:#45baff;text-shadow:0 0 25px #087cff}
header h1{font-size:30px;margin:8px 0;color:white}
header p{color:#a9c4e4;margin:0}
.container{max-width:1150px;margin:auto;padding:30px 18px}
h2{font-size:24px;color:#58baff;margin:10px 0 22px}
.search{width:100%;padding:16px 20px;border-radius:14px;border:1px solid #214d7e;background:#0d1b31;color:white;font-size:16px;margin-bottom:28px;outline:none}
.search:focus{border-color:#168cff;box-shadow:0 0 0 3px #087cff30}
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px}
.app{background:linear-gradient(145deg,#122945,#0a172b);border:1px solid #214c79;border-radius:22px;padding:26px 22px;text-align:center;box-shadow:0 12px 35px #0005;transition:.25s}
.app:hover{transform:translateY(-6px);border-color:#299fff;box-shadow:0 15px 40px #087cff25}
.app-logo{width:100px;height:100px;object-fit:cover;border-radius:23px;margin:0 auto 15px;display:block;box-shadow:0 8px 25px #0008}
.app h3{font-size:20px;margin:10px 0;color:#fff}
.app p{color:#a9bfd9;min-height:48px}
.download{display:block;background:linear-gradient(100deg,#087cff,#19b5ff);color:white;text-decoration:none;padding:13px;border-radius:12px;font-weight:bold;margin-top:18px;box-shadow:0 6px 18px #087cff35}
.download:hover{filter:brightness(1.15)}
.video-banner{width:100%;margin:20px auto;border:1px solid #174b78;border-radius:18px;overflow:hidden;background:#000}
.video-banner video{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:contain}
footer{text-align:center;color:#829bb8;padding:30px;border-top:1px solid #183454;margin-top:25px}
@media(max-width:600px){header{padding:25px 12px}header h1{font-size:24px}.container{padding:22px 14px}.apps{grid-template-columns:1fr}.app{padding:23px}}

</style>
</head>
<body>
<header>
<div class="logo">FALAH STORE</div>
<h1>برامج فلاح ستور</h1>
<p>جميع برامجنا وتطبيقاتنا بمكان واحد</p>
</header>
<section class="container video-banner">
<video autoplay muted loop playsinline controls>
<source src="Uuuuu.mp4" type="video/mp4">
متصفحك لا يدعم تشغيل الفيديو.
</video>
</section>
<main class="container">
<h2>تطبيقاتنا</h2>
<input class="search" id="search" placeholder="ابحث عن برنامج..." oninput="filterApps()">
<div class="apps" id="apps">
<div class="app">
<img class="app-logo" src="falah-logo.jpg" alt="فلاح ستور">
<h3>مشغل فلاح ستور</h3>
<p>مشغل الوسائط والترفيه من فلاح ستور</p>
<a class="download" href="https://raw.githubusercontent.com/falah11hassn11-beep/apks/main/FALAH_STORE_NEW.apk">تنزيل البرنامج</a>
</div>
<div class="app">
<img class="app-logo" src="falah-logo.jpg" alt="فلاح ستور">
<h3>برامج فلاح ستور برو</h3>
<p>تطبيقات وخدمات فلاح ستور برو</p>
<a class="download" href="#" onclick="alert('سيتم إضافة رابط البرنامج قريباً');return false">قريباً</a>
</div>
<div class="app">
<img class="app-logo" src="falah-logo.jpg" alt="فلاح ستور">
<h3>برامج فلاح ستور العادي</h3>
<p>تطبيقات وخدمات فلاح ستور</p>
<a class="download" href="#" onclick="alert('سيتم إضافة رابط البرنامج قريباً');return false">قريباً</a>
</div>
</div>
</main>
<footer>جميع الحقوق محفوظة © FALAH STORE</footer>
<script>
function filterApps(){
let q=document.getElementById('search').value.toLowerCase();
document.querySelectorAll('.app').forEach(app=>{
app.style.display=app.innerText.toLowerCase().includes(q)?'block':'none';
});
}
</script>
</body>
</html>
