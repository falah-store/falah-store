<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>برامج فلاح ستور</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:white;font-family:Arial,sans-serif}
header{padding:35px 15px;text-align:center;background:linear-gradient(135deg,#101c35,#07101d);border-bottom:1px solid #173b65}
.logo{font-size:30px;font-weight:bold;color:#18a5ff}
header p{color:#aabbd0}
.container{max-width:950px;margin:auto;padding:25px 15px}
.search{width:100%;padding:15px;border-radius:12px;border:1px solid #23466e;background:#111c2d;color:white;font-size:16px;margin-bottom:25px}
h2{color:#39aaff}
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.app{background:#111c2d;border:1px solid #203c5e;border-radius:17px;padding:22px;text-align:center}
.app-icon{width:85px;height:85px;border-radius:20px;background:#172d4a;margin:auto auto 15px;display:flex;align-items:center;justify-content:center;font-size:35px}
.app h3{margin:10px 0;color:#fff}
.app p{color:#aabbd0;min-height:40px}
.download{display:block;background:#078bea;color:white;text-decoration:none;padding:13px;border-radius:10px;font-weight:bold;margin-top:15px}
footer{text-align:center;color:#8293a9;padding:30px}
</style>
</head>
<body>
<header>
<div class="logo">FALAH STORE</div>
<h1>برامج فلاح ستور</h1>
<p>جميع برامجنا وتطبيقاتنا بمكان واحد</p>
</header>
<main class="container">
<h2>تطبيقاتنا</h2>
<input class="search" id="search" placeholder="ابحث عن برنامج..." oninput="filterApps()">
<div class="apps" id="apps">
<div class="app">
<div class="app-icon">📺</div>
<h3>مشغل فلاح ستور</h3>
<p>مشغل الوسائط والترفيه من فلاح ستور</p>
<a class="download" href="https://raw.githubusercontent.com/falah11hassn11-beep/apks/main/FALAH_STORE_NEW.apk">تنزيل البرنامج</a>
</div>
<div class="app">
<div class="app-icon">🚀</div>
<h3>برامج فلاح ستور برو</h3>
<p>تطبيقات وخدمات فلاح ستور برو</p>
<a class="download" href="#" onclick="alert('سيتم إضافة رابط البرنامج قريباً');return false">قريباً</a>
</div>
</div>
</main>
<footer>جميع الحقوق محفوظة © FALAH STORE</footer>
<script>
function filterApps(){
let q=document.getElementById('search').value.toLowerCase();
document.querySelectorAll('.app').forEach(app=>{
app.style.display=app.innerText.toLowerCase().includes(q)?'block':'none';
});
}
</script>
</body>
</html>
